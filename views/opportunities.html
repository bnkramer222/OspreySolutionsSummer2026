<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Opportunities</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .actions { display: flex; gap: 8px; }
        button, a { padding: 6px 12px; cursor: pointer; text-decoration: none; }
        .btn-edit { background: #4CAF50; color: white; border: none; border-radius: 4px; }
        .btn-delete { background: #f44336; color: white; border: none; border-radius: 4px; }
        .btn-matches { background: #2196F3; color: white; border: none; border-radius: 4px; }
        .btn-add { background: #333; color: white; border: none; border-radius: 4px; padding: 10px 16px; }
        .top-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #no-results { display: none; color: red; margin-top: 10px; }
        #matches-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; min-width: 300px; z-index: 100; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
    </style>
</head>
<body>
    <h1>Manage Opportunities</h1>

    <div class="top-bar">
        <a href="/opportunities/new" class="btn-add">+ Add New Opportunity</a>

        <select id="filter-select" onchange="applyFilter()">
            <option value="all">All</option>
            <option value="recent">Most Recent (60 days)</option>
            <option value="center">By Center</option>
        </select>

        <input type="text" id="search-input" placeholder="Search opportunities..." oninput="searchOpportunities()" />
    </div>

    <p id="no-results">No opportunities matched your search criteria.</p>

    <table id="opportunity-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Center</th>
                <th>Date</th>
                <th>Skills Needed</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="opportunity-body"></tbody>
    </table>

    <div id="overlay" onclick="closeMatches()"></div>
    <div id="matches-modal">
        <h3>Matched Volunteers</h3>
        <ul id="matches-list"></ul>
        <button onclick="closeMatches()">Close</button>
    </div>

    <script>
        let allOpportunities = [];

        async function loadOpportunities(filter = "all", search = "") {
            let url = `/opportunities?filter=${filter}`;
            if (search) url += `&search=${search}`;

            const res = await fetch(url);
            const data = await res.json();
            allOpportunities = data.opportunities;
            renderTable(allOpportunities);
        }

        function renderTable(opportunities) {
            const tbody = document.getElementById("opportunity-body");
            const noResults = document.getElementById("no-results");

            tbody.innerHTML = "";

            if (opportunities.length === 0) {
                noResults.style.display = "block";
                return;
            }

            noResults.style.display = "none";

            opportunities.forEach(op => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${op.name}</td>
                    <td>${op.center}</td>
                    <td>${op.date}</td>
                    <td>${op.skills_needed || "N/A"}</td>
                    <td>${op.status}</td>
                    <td class="actions">
                        <a href="/opportunities/${op.id}/edit" class="btn-edit">Edit</a>
                        <form method="POST" action="/opportunities/${op.id}/delete" style="margin:0">
                            <button type="submit" class="btn-delete" onclick="return confirm('Delete this opportunity?')">Delete</button>
                        </form>
                        <button class="btn-matches" onclick="viewMatches(${op.id})">View Matches</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function applyFilter() {
            const filter = document.getElementById("filter-select").value;
            loadOpportunities(filter);
        }

        function searchOpportunities() {
            const search = document.getElementById("search-input").value;
            loadOpportunities("all", search);
        }

        async function viewMatches(id) {
            const res = await fetch(`/opportunities/${id}/matches`);
            const data = await res.json();
            const list = document.getElementById("matches-list");
            list.innerHTML = "";

            if (data.matches.length === 0) {
                list.innerHTML = "<li>No volunteers matched.</li>";
            } else {
                data.matches.forEach(v => {
                    const li = document.createElement("li");
                    li.textContent = `${v.first_name} ${v.last_name}`;
                    list.appendChild(li);
                });
            }

            document.getElementById("matches-modal").style.display = "block";
            document.getElementById("overlay").style.display = "block";
        }

        function closeMatches() {
            document.getElementById("matches-modal").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        loadOpportunities();
    </script>
</body>
</html>
