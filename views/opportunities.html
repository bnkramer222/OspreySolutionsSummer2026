<html>
<head>
    <title>Opportunities</title>
</head>
<body>
    <h1>Manage Opportunities</h1>

    <label for="opportunity-filter">Filter opportunities:</label>
    <select id="opportunity-filter" onchange="applyFilter()">
        <option value="all">All opportunities</option>
        <option value="recent">Most Recent (60 days)</option>
        <option value="center">By Center</option>
    </select>

    <input type="text" id="search-input" placeholder="Search opportunities..." oninput="searchOpportunities()" />

    <p id="no-results" style="display:none; color:red;">No opportunities matched your search criteria.</p>

    <ul id="opportunityList"></ul>

    <button onclick="window.location.href='/opportunities/new'">Add New Opportunity</button>

    <div id="matches-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:1px solid #ccc; min-width:300px;">
        <h3>Matched Volunteers</h3>
        <ul id="matches-list"></ul>
        <button onclick="closeMatches()">Close</button>
    </div>

    <script>
        async function loadOpportunities(filter = "all", search = "") {
            let url = `/opportunities?filter=${filter}`;
            if (search) url += `&search=${search}`;

            const res = await fetch(url);
            const data = await res.json();
            renderList(data.opportunities);
        }

        function renderList(opportunities) {
            const list = document.getElementById("opportunityList");
            const noResults = document.getElementById("no-results");
            list.innerHTML = "";

            if (opportunities.length === 0) {
                noResults.style.display = "block";
                return;
            }

            noResults.style.display = "none";

            opportunities.forEach(op => {
                const li = document.createElement("li");
                li.innerHTML = `
                    ${op.name} - ${op.center} - ${op.date} - ${op.status}
                    <button onclick="window.location.href='/opportunities/${op.id}/edit'">Edit</button>
                    <form method="POST" action="/opportunities/${op.id}/delete" style="display:inline">
                        <button type="submit" onclick="return confirm('Delete this opportunity?')">Delete</button>
                    </form>
                    <button onclick="viewMatches(${op.id})">View Matches</button>
                `;
                list.appendChild(li);
            });
        }

        function applyFilter() {
            const filter = document.getElementById("opportunity-filter").value;
            loadOpportunities(filter);
        }

        function searchOpportunities() {
            const search = document.getElementById("search-input").value;
            loadOpportunities("all", search);
        }

        async function viewMatches(id) {
            const res = await fetch(`/opportunities/${id}/matches`);
            const data = await res.json();
            const list = document.getElementById("matches-list");
            list.innerHTML = "";

            if (data.matches.length === 0) {
                list.innerHTML = "<li>No volunteers matched.</li>";
            } else {
                data.matches.forEach(v => {
                    const li = document.createElement("li");
                    li.textContent = `${v.first_name} ${v.last_name}`;
                    list.appendChild(li);
                });
            }

            document.getElementById("matches-modal").style.display = "block";
        }

        function closeMatches() {
            document.getElementById("matches-modal").style.display = "none";
        }

        loadOpportunities();
    </script>
</body>
</html>
