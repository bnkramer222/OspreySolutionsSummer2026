<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Form - VMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        nav {
            background: #0a0a0a;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .nav-logo { font-size: 20px; font-weight: 800; color: white; }
        .nav-logo span { color: #ff6b35; }
        .nav-links { display: flex; gap: 8px; }

        .nav-link {
            color: #999;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover { color: white; background: #ffffff15; }
        .nav-link.active { color: white; background: #a855f7; }

        .nav-logout {
            background: #ffffff15;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background 0.2s;
        }

        .nav-logout:hover { background: #ff6b35; }

        .page-header {
            background: #0a0a0a;
            padding: 40px;
            color: white;
        }

        .page-header h1 { font-size: 28px; font-weight: 800; }
        .page-header h1 span { color: #a855f7; }
        .page-header p { color: #999; margin-top: 6px; font-size: 14px; }

        .content { max-width: 700px; margin: 0 auto; padding: 32px 40px; }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
        }

        input, textarea, select {
            padding: 12px 14px;
            border: 2px solid #e5e5e5;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, textarea:focus, select:focus { border-color: #a855f7; }
        textarea { resize: vertical; min-height: 100px; }

        .error-msg { font-size: 12px; color: #dc2626; display: none; }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 28px;
            border-top: 2px solid #f5f5f5;
        }

        .btn-save {
            flex: 1;
            padding: 14px;
            background: #0a0a0a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-save:hover { background: #a855f7; }

        .btn-cancel {
            padding: 14px 24px;
            background: #f5f5f5;
            color: #666;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-cancel:hover { background: #e5e5e5; color: #0a0a0a; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Osprey<span>VMS</span></div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/volunteers" class="nav-link">Volunteers</a>
            <a href="/opportunities" class="nav-link active">Opportunities</a>
        </div>
        <button class="nav-logout" onclick="window.location.href='/'">Log Out</button>
    </nav>

    <div class="page-header">
        <h1 id="form-title">Add <span>Opportunity</span></h1>
        <p>Fill in the details below to create a new volunteer opportunity.</p>
    </div>

    <div class="content">
        <div class="form-card">
            <form id="opportunity-form" method="POST">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Opportunity Name *</label>
                        <input type="text" name="name" id="name" placeholder="e.g. Food Bank Volunteer Day" />
                        <span class="error-msg" id="name-error">Name is required.</span>
                    </div>

                    <div class="form-group">
                        <label>Center *</label>
                        <input type="text" name="center" id="center" placeholder="e.g. Downtown Center" />
                        <span class="error-msg" id="center-error">Center is required.</span>
                    </div>

                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" name="date" id="date" />
                        <span class="error-msg" id="date-error">Date is required.</span>
                    </div>

                    <div class="form-group full">
                        <label>Description</label>
                        <textarea name="description" id="description" placeholder="Describe what volunteers will be doing..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Skills Needed</label>
                        <input type="text" name="skills_needed" id="skills_needed" placeholder="e.g. Communication, Lifting" />
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select name="status" id="status">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='/opportunities'">Cancel</button>
                    <button type="submit" class="btn-save" onclick="return validateForm()">Save Opportunity →</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split("/");
        const isEdit = pathParts.includes("edit");
        const opportunityId = isEdit ? pathParts[2] : null;

        if (isEdit) {
            document.getElementById("form-title").innerHTML = 'Edit <span style="color:#a855f7">Opportunity</span>';
            document.getElementById("opportunity-form").action = `/opportunities/${opportunityId}/edit`;

            fetch(`/opportunities/${opportunityId}/data`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("name").value = data.name;
                    document.getElementById("center").value = data.center;
                    document.getElementById("date").value = data.date;
                    document.getElementById("description").value = data.description || "";
                    document.getElementById("skills_needed").value = data.skills_needed || "";
                    document.getElementById("status").value = data.status;
                });
        } else {
            document.getElementById("opportunity-form").action = "/opportunities/new";
        }

        function validateForm() {
            const name = document.getElementById("name").value.trim();
            const center = document.getElementById("center").value.trim();
            const date = document.getElementById("date").value.trim();

            document.getElementById("name-error").style.display = name ? "none" : "block";
            document.getElementById("center-error").style.display = center ? "none" : "block";
            document.getElementById("date-error").style.display = date ? "none" : "block";

            return !!(name && center && date);
        }
    </script>
</body>
</html>
