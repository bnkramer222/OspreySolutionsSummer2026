<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMS Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-shapes {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }

        .shape-1 {
            width: 400px; height: 400px;
            background: #ff6b35;
            top: -100px; left: -100px;
        }

        .shape-2 {
            width: 300px; height: 300px;
            background: #00d4ff;
            bottom: -80px; right: -80px;
        }

        .shape-3 {
            width: 200px; height: 200px;
            background: #a855f7;
            top: 50%; left: 60%;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px;
            width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 48px; height: 48px;
            background: #0a0a0a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #0a0a0a;
            letter-spacing: -0.5px;
        }

        .logo-text span { color: #ff6b35; }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0a0a0a;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0a0a0a;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
            outline: none;
            font-family: inherit;
        }

        input:focus { border-color: #0a0a0a; }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: #0a0a0a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        button[type="submit"]:hover {
            background: #ff6b35;
            transform: translateY(-1px);
        }

        #errorMessage {
            color: #ff3b3b;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
        }

        .divider {
            height: 3px;
            background: linear-gradient(90deg, #ff6b35, #a855f7, #00d4ff);
            border-radius: 3px;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="card">
        <div class="logo">
            <div class="logo-icon">🤝</div>
            <div class="logo-text">Osprey<span>VMS</span></div>
        </div>
        <div class="divider"></div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to manage your volunteer program</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="admin@test.com" required />

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required />

            <button type="submit">Sign In →</button>
            <p id="errorMessage"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = "/dashboard";
            } else {
                document.getElementById("errorMessage").textContent = "Invalid email or password.";
            }
        });
    </script>
</body>
</html>
