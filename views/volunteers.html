<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteers - VMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        nav { background: #0a0a0a; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .nav-logo { font-size: 20px; font-weight: 800; color: white; }
        .nav-logo span { color: #ff6b35; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link { color: #999; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .nav-link:hover { color: white; background: #ffffff15; }
        .nav-link.active { color: white; background: #ff6b35; }
        .nav-logout { background: #ffffff15; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.2s; }
        .nav-logout:hover { background: #ff6b35; }
        .page-header { background: #0a0a0a; padding: 40px; color: white; position: relative; overflow: hidden; }
        .page-header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 250px; height: 250px; background: #ff6b35; border-radius: 50%; opacity: 0.15; }
        .page-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
        .page-header h1 span { color: #ff6b35; }
        .page-header p { color: #999; margin-top: 6px; font-size: 14px; }
        .content { max-width: 1100px; margin: 0 auto; padding: 32px 40px; }
        .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #e5e5e5; border-radius: 12px; font-size: 14px; font-family: inherit; outline: none; background: white; transition: border-color 0.2s; }
        .search-box:focus { border-color: #ff6b35; }
        select { padding: 12px 16px; border: 2px solid #e5e5e5; border-radius: 12px; font-size: 14px; font-family: inherit; outline: none; background: white; cursor: pointer; transition: border-color 0.2s; }
        select:focus { border-color: #ff6b35; }
        .btn-add { background: #0a0a0a; color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.2s; white-space: nowrap; text-decoration: none; display: inline-block; }
        .btn-add:hover { background: #ff6b35; }
        .no-results { display: none; text-align: center; padding: 60px; color: #999; background: white; border-radius: 16px; }
        .no-results .icon { font-size: 48px; margin-bottom: 12px; }
        .no-results p { font-size: 16px; font-weight: 600; }
        .volunteer-grid { display: grid; gap: 16px; }
        .volunteer-card { background: white; border-radius: 16px; padding: 24px; display: flex; align-items: center; justify-content: space-between; border: 2px solid transparent; transition: border-color 0.2s, box-shadow 0.2s; gap: 16px; }
        .volunteer-card:hover { border-color: #ff6b35; box-shadow: 0 8px 24px rgba(255, 107, 53, 0.1); }
        .vol-left { display: flex; align-items: center; gap: 16px; flex: 1; }
        .vol-avatar { width: 48px; height: 48px; background: #fff3ee; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
        .vol-info h3 { font-size: 16px; font-weight: 700; color: #0a0a0a; margin-bottom: 4px; }
        .vol-meta { display: flex; gap: 12px; flex-wrap: wrap; }
        .vol-tag { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-approved { background: #dcfce7; color: #16a34a; }
        .badge-pending { background: #fef9c3; color: #ca8a04; }
        .badge-disapproved { background: #fee2e2; color: #dc2626; }
        .badge-inactive { background: #f3f4f6; color: #6b7280; }
        .vol-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
        .btn-edit { background: #f3f4f6; color: #0a0a0a; }
        .btn-edit:hover { background: #0a0a0a; color: white; }
        .btn-matches { background: #fff3ee; color: #ff6b35; }
        .btn-matches:hover { background: #ff6b35; color: white; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 99; backdrop-filter: blur(4px); }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 32px; border-radius: 20px; min-width: 340px; z-index: 100; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: #0a0a0a; }
        .modal ul { list-style: none; }
        .modal ul li { padding: 10px 0; border-bottom: 1px solid #f5f5f5; color: #333; font-size: 14px; }
        .modal-close { margin-top: 20px; width: 100%; padding: 12px; background: #0a0a0a; color: white; border: none; border-radius: 10px; cursor: pointer; font-family: inherit; font-weight: 700; transition: background 0.2s; }
        .modal-close:hover { background: #ff6b35; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Osprey<span>VMS</span></div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/volunteers" class="nav-link active">Volunteers</a>
            <a href="/opportunities" class="nav-link">Opportunities</a>
        </div>
        <button class="nav-logout" onclick="window.location.href='/'">Log Out</button>
    </nav>

    <div class="page-header">
        <h1>Manage <span>Volunteers</span> 👥</h1>
        <p>View, add, edit, and filter volunteers across your organization.</p>
    </div>

    <div class="content">
        <div class="toolbar">
            <input type="text" class="search-box" id="search-input" placeholder="🔍  Search volunteers..." />
            <select id="volunteer-filter">
                <option value="All">All Volunteers</option>
                <option value="Approved/Pending">Approved / Pending</option>
                <option value="Approved">Approved</option>
                <option value="Pending Approval">Pending Approval</option>
                <option value="Disapproved">Disapproved</option>
                <option value="Inactive">Inactive</option>
            </select>
            <button class="btn-add" onclick="location.href='/volunteer-form'">+ Add New Volunteer</button>
        </div>

        <div class="no-results" id="no-results">
            <div class="icon">🔍</div>
            <p>No volunteers matched your search.</p>
        </div>

        <div class="volunteer-grid" id="volunteer-grid"></div>
    </div>

    <div class="overlay" id="overlay" onclick="closeMatches()"></div>
    <div class="modal" id="matches-modal">
        <h3>📋 Matched Opportunities</h3>
        <ul id="matches-list"></ul>
        <button class="modal-close" onclick="closeMatches()">Close</button>
    </div>

    <script src="/public/js/volunteers.js"></script>
</body>
</html>
